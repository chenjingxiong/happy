name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'packages/happy-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        type: choice
        default: 'preview'
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build Android (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 14.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine EAS profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Start EAS build (non-blocking)
        id: start
        working-directory: packages/happy-app
        run: |
          eas build \
            --platform android \
            --profile "${{ steps.profile.outputs.name }}" \
            --no-wait \
            --non-interactive \
            --json > /tmp/eas_start.json
          BUILD_ID=$(jq -r '.[0].id // empty' /tmp/eas_start.json)
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not extract buildId from EAS output"
            exit 1
          fi

      - name: Poll EAS build status
        id: poll
        working-directory: packages/happy-app
        run: |
          BUILD_ID="${{ steps.start.outputs.build_id }}"
          ATTEMPTS=0
          MAX_ATTEMPTS=50
          while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
            eas build:view "$BUILD_ID" --json > /tmp/eas_view.json
            STATUS=$(jq -r '.status' /tmp/eas_view.json)
            echo "status=$STATUS (attempt $((ATTEMPTS + 1))/$MAX_ATTEMPTS)"
            case "$STATUS" in
              FINISHED)
                echo "::notice::Build finished successfully"
                break
                ;;
              ERRORED|CANCELED)
                echo "::error::EAS build ended with status=$STATUS"
                echo "Build ID: $BUILD_ID"
                echo "Build URL: https://expo.dev/accounts/$(jq -r '.project.ownerAccount.name // empty' /tmp/eas_view.json)/projects/$(jq -r '.project.slug // empty' /tmp/eas_view.json)/builds/$BUILD_ID"
                exit 1
                ;;
              *)
                sleep 60
                ;;
            esac
            ATTEMPTS=$((ATTEMPTS + 1))
          done
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "::error::Timed out waiting for EAS build"
            exit 1
          fi

      - name: Download APK
        id: download
        working-directory: packages/happy-app
        run: |
          BUILD_ID="${{ steps.start.outputs.build_id }}"
          eas build:view "$BUILD_ID" --json > /tmp/eas_view.json
          APK_URL=$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' /tmp/eas_view.json)
          echo "APK URL: $APK_URL"
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::No APK URL in build artifacts"
            exit 1
          fi
          EXT="${APK_URL##*.}"
          EXT="${EXT%%\?*}"
          case "$EXT" in
            apk|aab) ;;
            *) EXT="apk" ;;
          esac
          OUTPUT="/tmp/happy-android.$EXT"
          curl -L -o "$OUTPUT" "$APK_URL"
          ls -lh "$OUTPUT"
          echo "ARTIFACT_PATH=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-${{ steps.profile.outputs.name }}
          path: ${{ steps.download.outputs.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14
